<svg xmlns="http://www.w3.org/2000/svg" width="960" height="256" viewBox="0 0 960 256" role="img" aria-labelledby="title desc">
<title id="title">Developer tools and experiments</title>
<desc id="desc">Data and AI-assisted development. Three overlapping technical sketches show data, code, and a connected graph. One subtle four-second line animation ends on the complete illustration. Reduced motion shows a static image.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151B24"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
