</defs>
<style>
@media(prefers-reduced-motion:no-preference){
.trace{animation:trace 4s cubic-bezier(.22,.61,.36,1) 1}
.reveal{animation:reveal 4s ease-out 1}
}
@keyframes trace{0%,10%{stroke-dashoffset:600}85%,100%{stroke-dashoffset:0}}
@keyframes reveal{0%,35%{opacity:.35}85%,100%{opacity:1}}
</style>
