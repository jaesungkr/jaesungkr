<svg xmlns="http://www.w3.org/2000/svg" width="440" height="357" viewBox="0 0 440 357" role="img" aria-labelledby="stream-title stream-desc"><title id="stream-title">Merge stream</title><desc id="stream-desc">Moving dots represent verified merges only. Snapshot preview · not a CI signal</desc><style>svg{--ink:#19372e;--muted:#65776d;--line:#c9d6cd;--accent:#27836e;--open:#91a59a;}text{fill:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.muted{fill:var(--muted)}.spine{stroke:var(--line)}.merged-line{stroke:var(--accent)}.open-line{stroke:var(--open)}.merged-node,.particle{fill:var(--accent)}.open-node{fill:transparent;stroke:var(--open)}@media(prefers-reduced-motion:reduce){.particle{display:none}}</style><path d="M 404 56 V 300" class="spine" stroke-width="1.5" fill="none"/><text x="16" y="26" font-size="20" class="" font-weight="600">Recently merged · 2/2 shown</text><g class="verified-merge"><title>scipy/scipy #26713 · Merged</title><text x="16" y="69" font-size="18" class="" font-weight="550">scipy/scipy</text><text x="16" y="90" font-size="16" class="muted" >#26713 · Merged</text><path d="M 304 74 H 338 Q 360 74 372 90 T 404 106" class="merged-line" stroke-width="1.5" fill="none"/><circle cx="304" cy="74" r="3" class="merged-node"/><circle cx="404" cy="106" r="3" class="merged-node"/><circle r="3" class="particle" opacity="0"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" path="M 304 74 H 338 Q 360 74 372 90 T 404 106" calcMode="paced"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.82;1" dur="6s" begin="0s" repeatCount="indefinite"/></circle></g><g class="verified-merge"><title>joblib/joblib #1951 · Merged</title><text x="16" y="119" font-size="18" class="" font-weight="550">joblib/joblib</text><text x="16" y="140" font-size="16" class="muted" >#1951 · Merged</text><path d="M 304 124 H 338 Q 360 124 372 140 T 404 156" class="merged-line" stroke-width="1.5" fill="none"/><circle cx="304" cy="