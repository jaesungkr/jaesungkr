<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">Find the signal. Build the system.</title>
  <desc id="desc">Data, AI, engineering. A field of scattered observations resolves into a clean signal and connected nodes. A single four-second drawing animation stops on the complete design. Reduced-motion settings show the static design.</desc>
  <defs>
    <linearGradient id="signal" x1="0" x2="1"><stop stop-color="#91AAFF"/><stop offset="1" stop-color="#77E5CE"/></linearGradient>
  </defs>
  <style>
    .trace {stroke-dasharray:1;stroke-dashoffset:0;animation:draw 4s cubic-bezier(.25,.1,.25,1) 1}
    .node {animation:arrive 4s ease-out 1}
    @keyframes draw {0%,12% {stroke-dashoffset:1} 78%,100% {stroke-dashoffset:0}}
    @keyframes arrive {0%,65% {opacity:.3} 90%,100% {opacity:1}}
    @media (prefers-reduced-motion:reduce) {.trace,.node {animation:none}}
  </style>
  <rect width="960" height="320" rx="20" fill="#101217"/>
  <path d="M42 50h20" stroke="#91AAFF" stroke-width="4" stroke-linecap="round"/>
  <text x="80" y="60" fill="#B7BDC9" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" letter-spacing="1.8">DATA / AI / ENGINEERING</text>
  <g fill="#F5F5F7" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="-2.3">
    <text x="40" y="154">Find the signal.</text>
    <text x="40" y="232">Build the system.</text>
  </g>
  <g transform="translate(655 95)">
    <g fill="#626D85" opacity=".65">
      <circle cx="8" cy="35" r="3"/><circle cx="34" cy="12" r="3"/><circle cx="24" cy="72" r="3"/>
      <circle cx="60" cy="44" r="3"/><circle cx="47" cy="105" r="3"/><circle cx="10" cy="127" r="3"/>
      <circle cx="75" cy="8" r="3"/><circle cx="75" cy="136" r="3"/><circle cx="95" cy="25" r="3"/>
    </g>
    <path d="M0 90L28 90 45 70 64 111 86 39 109 122 129 89H154L183 60H236" fill="none" stroke="#29313F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path class="trace" pathLength="1" d="M0 90L28 90 45 70 64 111 86 39 109 122 129 89H154L183 60H236" fill="none" stroke="url(#signal)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M154 89L183 119H236" fill="none" stroke="#64799E" stroke-width="2"/>
    <g class="node" fill="#101217" stroke="#77E5CE" stroke-width="2.5">
      <circle cx="236" cy="60" r="10"/><circle cx="236" cy="119" r="10"/>
    </g>
    <circle cx="154" cy="89" r="5" fill="#91AAFF"/>
    <circle class="node" cx="236" cy="60" r="3" fill="#77E5CE"/>
    <circle class="node" cx="236" cy="119" r="3" fill="#77E5CE"/>
  </g>
</svg>
