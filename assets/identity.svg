<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
<title id="title">Data into useful tools.</title>
<desc id="desc">A coral data grid connects to a desktop window, linking data research and AI-assisted workflows with practical software. Motion plays once for four seconds, unless reduced motion is requested.</desc>
<style>
@keyframes travel {0%,10% {transform:translateX(0);opacity:0} 20%{opacity:1} 70%{transform:translateX(54px);opacity:1} 90%,100%{transform:translateX(54px);opacity:0}}
@keyframes resolve {0%,60%{opacity:0} 85%,100%{opacity:1}}
.packet{opacity:0;animation:travel 4s ease-in-out 1}
.resolve{animation:resolve 4s ease-in-out 1}
@media(prefers-reduced-motion:reduce){.packet,.resolve{animation:none}.packet{display:none}}
</style>
<rect width="960" height="280" rx="18" fill="#111B25"/>
<path d="M36 38h28" stroke="#F36A55" stroke-width="5" stroke-linecap="round"/>
<text x="86" y="45" fill="#AABCC4" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" letter-spacing="2">DATA × AI → SOFTWARE</text>
<g fill="#F5F3ED" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="66" letter-spacing="-2">
<text x="38" y="132">Data into</text><text x="38" y="207">useful tools.</text>
</g>
<g transform="translate(624 50)">
<path d="M12 92H210" stroke="#52707D" stroke-width="2"/>
<rect x="110" y="22" width="166" height="148" rx="14" fill="#1B2C38" stroke="#66818C" stroke-width="2"/>
<path d="M110 57H276" stroke="#66818C" stroke-width="2"/>
