<circle cx="140" cy="40" r="3.5" fill="#66818C"/>
<rect x="130" y="80" width="40" height="67" rx="5" fill="#34505D"/>
<rect x="182" y="80" width="72" height="8" rx="4" fill="#E8E7E2"/>
<rect x="182" y="100" width="54" height="7" rx="3.5" fill="#66818C"/>
<rect class="resolve" x="182" y="120" width="72" height="27" rx="5" fill="#F36A55"/>
<rect x="0" y="60" width="91" height="91" rx="11" fill="#111B25" stroke="#34505D" stroke-width="2"/>
<g fill="#F36A55"><rect x="16" y="76" width="13" height="13" rx="3"/><rect x="39" y="76" width="13" height="13" rx="3"/><rect x="62" y="76" width="13" height="13" rx="3"/><rect x="16" y="99" width="13" height="13" rx="3"/><rect x="62" y="99" width="13" height="13" rx="3"/><rect x="16" y="122" width="13" height="13" rx="3"/><rect x="39" y="122" width="13" height="13" rx="3"/><rect x="62" y="122" width="13" height="13" rx="3"/></g>
<rect x="39" y="99" width="13" height="13" rx="3" fill="none" stroke="#F36A55" stroke-width="1.5" stroke-dasharray="2 2"/>
